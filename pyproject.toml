[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ransomwatch-canary"
version = "0.2.0"
description = "Safe local canary integrity monitoring for defensive ransomware research"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Muhammet0-1" }]
keywords = ["blue-team", "canary", "endpoint-security", "ransomware", "monitoring"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = ["watchdog>=3.0,<7"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
ransomwatch = "ransomwatch.cli:main"

[project.urls]
Homepage = "https://github.com/Muhammet0-1/RansomWatch"
Issues = "https://github.com/Muhammet0-1/RansomWatch/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ransomwatch = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["ransomwatch"]
